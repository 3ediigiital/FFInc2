PASTE THIS ENTIRE BLOCK INTO A BREAKDANCE CODE ELEMENT
IN THE GLOBAL HEADER BUILDER

<style>
/* ── Primary nav bar ── */
.pn{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(5,13,24,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(74,159,224,.12);padding:0 48px;height:66px;display:flex;align-items:center;justify-content:space-between}
.pn-logo{display:flex;align-items:center;gap:10px;text-decoration:none}

/* ── Logo image (replaces snowflake icon box + wordmark) ── */
.pn-logo-img{height:40px;width:auto;display:block;transition:filter 0.3s ease}
/* Dark mode (default) — render as solid white silhouette */
.pn-logo-img{filter:brightness(0) invert(1)}
/* Light mode — show logo in its true original colors */
body.light-mode .pn-logo-img{filter:none}

/* ── Nav links ── */
.pn-links{display:flex;align-items:center;gap:28px}
.pn-links a{font-size:13px;color:#9BBFD8;text-decoration:none;transition:color .2s}
.pn-links a:hover{color:#fff}
.pn-div{width:1px;height:18px;background:rgba(74,159,224,.2)}

/* ── "List Your Business" CTA ── */
.pn-cta{background:linear-gradient(135deg,#4A9FE0,#2D7FC4);color:#fff;border:none;padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',system-ui;box-shadow:0 4px 18px rgba(74,159,224,.4);transition:transform .15s,box-shadow .15s}
.pn-cta:hover{transform:translateY(-1px);box-shadow:0 6px 26px rgba(74,159,224,.62)}

/* ── Dark/light mode toggle button (JS logic loads site-wide via main.js) ── */
#mode-toggle{width:34px;height:34px;border-radius:50%;border:1px solid rgba(74,159,224,0.28);background:rgba(74,159,224,0.08);color:#8DCAF2;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0;padding:0}
#mode-toggle:hover{background:rgba(74,159,224,0.18);border-color:rgba(74,159,224,0.5);color:#fff;transform:scale(1.08)}
#mode-toggle i{font-size:15px}
body.light-mode #mode-toggle{border-color:rgba(30,107,171,0.4);background:rgba(30,107,171,0.12);color:#1E6BAB}

/* ── Hamburger + mobile menu are hidden on desktop ── */
.pn-hamburger,
.pn-mobile-menu {
  display: none;
}

/* ── Mobile nav layout ── */
@media (max-width: 768px) {

  .pn {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 16px;
    height: 58px;
    position: relative;
  }

  .pn-links > a,
  .pn-div,
  #mode-toggle {
    display: none;
  }

  .pn-hamburger {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 32px;
    height: 32px;
    background: transparent;
    border: 1px solid rgba(74,159,224,.25);
    border-radius: 8px;
    cursor: pointer;
    padding: 8px;
    justify-self: start;
  }

  .pn-hamburger span {
    display: block;
    width: 100%;
    height: 1.5px;
    background: #8DCAF2;
    border-radius: 2px;
    transition: transform .25s, opacity .2s;
  }

  .pn-hamburger.open span:nth-child(1) {
    transform: translateY(5.5px) rotate(45deg);
  }
  .pn-hamburger.open span:nth-child(2) {
    opacity: 0;
  }
  .pn-hamburger.open span:nth-child(3) {
    transform: translateY(-5.5px) rotate(-45deg);
  }

  /* Explicit column placement — the CTA lives inside .pn-links,
     so pin the grid items directly to keep hamburger left / CTA
     right deterministically across all browser engines. */
  .pn-hamburger {
    grid-column: 1;
  }

  .pn-logo {
    grid-column: 2;
    justify-self: center;
  }

  .pn-logo-img {
    height: 30px;
  }

  .pn-links {
    grid-column: 3;
    justify-self: end;
  }

  .pn-cta {
    grid-column: 3;
    justify-self: end;
    padding: 7px 12px;
    font-size: 11px;
    white-space: nowrap;
  }

  .pn-mobile-menu {
    display: none;
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    background: rgba(8,18,32,.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(74,159,224,.15);
    flex-direction: column;
    padding: 8px 20px 16px;
    z-index: 99;
  }

  .pn-mobile-menu.open {
    display: flex;
  }

  .pn-mobile-menu a {
    color: #9BBFD8;
    text-decoration: none;
    font-size: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(74,159,224,.08);
  }

  .pn-mobile-menu a:last-of-type {
    border-bottom: none;
  }

  .pn-mobile-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    font-size: 13px;
    color: #9BBFD8;
  }

  #mode-toggle-mobile {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(74,159,224,.28);
    background: rgba(74,159,224,.08);
    color: #8DCAF2;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
}
</style>

<nav class="pn" aria-label="Primary navigation">
<a class="pn-logo" href="/"><img src="https://frozenfoodinc.com/wp-content/uploads/2026/07/FFinc_cropped_trans.png" alt="FrozenFoodInc" class="pn-logo-img"></a>
<div class="pn-links"><a href="#">Database</a><a href="#">Services</a><a href="#">For Suppliers</a><div class="pn-div"></div><a href="#">Sign In</a><button id="mode-toggle" aria-label="Switch to light mode" title="Toggle light/dark mode"><i class="ti ti-sun" id="mode-icon"></i></button><button class="pn-cta">List Your Business</button></div>
<button class="pn-hamburger" id="pn-hamburger" aria-label="Toggle menu" aria-expanded="false">
  <span></span>
  <span></span>
  <span></span>
</button>
<div class="pn-mobile-menu" id="pn-mobile-menu">
  <a href="#">Database</a>
  <a href="#">Services</a>
  <a href="#">For Suppliers</a>
  <a href="#">Sign In</a>
  <div class="pn-mobile-toggle-row">
    <span>Dark / Light Mode</span>
    <button id="mode-toggle-mobile" aria-label="Toggle theme">
      <i class="ti ti-sun" id="mode-icon-mobile"></i>
    </button>
  </div>
</div>
</nav>

<script>
(function() {
  var hamburger = document.getElementById('pn-hamburger');
  var mobileMenu = document.getElementById('pn-mobile-menu');
  var mobileToggle = document.getElementById('mode-toggle-mobile');
  var mobileIcon = document.getElementById('mode-icon-mobile');

  if (hamburger && mobileMenu) {
    hamburger.addEventListener('click', function() {
      var isOpen = mobileMenu.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', isOpen);
    });
  }

  if (mobileToggle) {
    mobileToggle.addEventListener('click', function() {
      document.body.classList.toggle('light-mode');
      var isLight = document.body.classList.contains('light-mode');
      if (mobileIcon) {
        mobileIcon.className = isLight ? 'ti ti-moon' : 'ti ti-sun';
      }
      var desktopIcon = document.getElementById('mode-icon');
      if (desktopIcon) {
        desktopIcon.className = isLight ? 'ti ti-moon' : 'ti ti-sun';
      }
    });
  }
})();
</script>
